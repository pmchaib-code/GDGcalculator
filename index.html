<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GDG Algiers Calculator — Precision & Google Design</title>
    <meta name="description" content="Production-ready precision web calculator designed for GDG Algiers with BODMAS operator precedence, Google Developer aesthetic, dark/light theme, and calculation history." />
    <meta property="og:title" content="GDG Algiers Calculator" />
    <meta property="og:description" content="Production-ready precision web calculator designed for GDG Algiers with BODMAS operator precedence, Google Developer aesthetic, dark/light theme, and calculation history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#131314" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <style>
      /* ==========================================================================
         CSS Design Tokens & Theme Variables (Google Palette & GDG Algiers)
         ========================================================================== */
      :root {
        /* Google Core Brand Colors */
        --google-blue: #4285F4;
        --google-blue-hover: #3367D6;
        --google-blue-surface: #E8F0FE;
        --google-blue-tint: rgba(66, 133, 244, 0.12);
        --google-red: #EA4335;
        --google-yellow: #FBBC05;
        --google-green: #34A853;
        --google-green-hover: #2D9249;

        /* Light Theme Surface Tokens */
        --bg-gradient-start: #F8F9FA;
        --bg-gradient-end: #EDF2F7;
        --ambient-glow-1: rgba(66, 133, 244, 0.12);
        --ambient-glow-2: rgba(52, 168, 83, 0.10);
        --ambient-glow-3: rgba(251, 188, 5, 0.08);
        --ambient-glow-4: rgba(234, 67, 53, 0.08);

        --card-bg: rgba(255, 255, 255, 0.88);
        --card-border: rgba(220, 224, 230, 0.8);
        --card-shadow: 0 24px 48px -12px rgba(60, 64, 67, 0.18), 0 8px 16px -6px rgba(60, 64, 67, 0.08);
        
        --display-bg: rgba(241, 243, 244, 0.95);
        --display-border: rgba(218, 220, 224, 0.7);
        --text-primary: #202124;
        --text-secondary: #5F6368;
        --text-muted: #80868B;

        /* Buttons */
        --btn-num-bg: #FFFFFF;
        --btn-num-text: #202124;
        --btn-num-hover: #F8F9FA;
        --btn-num-border: #E8EAED;
        --btn-num-shadow: 0 2px 4px rgba(60, 64, 67, 0.08);

        --btn-op-bg: #E8F0FE;
        --btn-op-text: #1A73E8;
        --btn-op-hover: #D2E3FC;
        --btn-op-border: rgba(66, 133, 244, 0.25);

        --btn-fn-bg: #F1F3F4;
        --btn-fn-text: #3C4043;
        --btn-fn-hover: #E8EAED;
        --btn-fn-border: #DADCE0;

        --btn-equals-bg: linear-gradient(135deg, #4285F4 0%, #1A73E8 100%);
        --btn-equals-text: #FFFFFF;
        --btn-equals-shadow: 0 4px 14px rgba(66, 133, 244, 0.45);

        --drawer-bg: rgba(255, 255, 255, 0.97);
        --drawer-border: #E8EAED;
        --drawer-item-bg: #F8F9FA;
        --drawer-item-hover: #F1F3F4;

        --ripple-color: rgba(66, 133, 244, 0.25);
        --focus-ring: rgba(66, 133, 244, 0.4);
      }

      [data-theme="dark"] {
        /* Dark Theme Surface Tokens */
        --bg-gradient-start: #0E0F12;
        --bg-gradient-end: #1A1C23;
        --ambient-glow-1: rgba(66, 133, 244, 0.18);
        --ambient-glow-2: rgba(52, 168, 83, 0.14);
        --ambient-glow-3: rgba(251, 188, 5, 0.12);
        --ambient-glow-4: rgba(234, 67, 53, 0.14);

        --card-bg: rgba(30, 31, 34, 0.85);
        --card-border: rgba(255, 255, 255, 0.1);
        --card-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.65), 0 0 1px 1px rgba(255, 255, 255, 0.05);

        --display-bg: rgba(19, 19, 20, 0.92);
        --display-border: rgba(255, 255, 255, 0.08);
        --text-primary: #E3E3E3;
        --text-secondary: #9AA0A6;
        --text-muted: #5F6368;

        /* Buttons */
        --btn-num-bg: #2B2C30;
        --btn-num-text: #F1F3F4;
        --btn-num-hover: #37393E;
        --btn-num-border: rgba(255, 255, 255, 0.08);
        --btn-num-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);

        --btn-op-bg: #1B2B44;
        --btn-op-text: #8AB4F8;
        --btn-op-hover: #233B5F;
        --btn-op-border: rgba(138, 180, 248, 0.2);

        --btn-fn-bg: #35373C;
        --btn-fn-text: #E8EAED;
        --btn-fn-hover: #43454B;
        --btn-fn-border: rgba(255, 255, 255, 0.09);

        --btn-equals-bg: linear-gradient(135deg, #4285F4 0%, #1A73E8 100%);
        --btn-equals-text: #FFFFFF;
        --btn-equals-shadow: 0 4px 18px rgba(66, 133, 244, 0.55);

        --drawer-bg: rgba(25, 26, 29, 0.97);
        --drawer-border: rgba(255, 255, 255, 0.08);
        --drawer-item-bg: #202124;
        --drawer-item-hover: #2B2C30;

        --ripple-color: rgba(138, 180, 248, 0.3);
        --focus-ring: rgba(138, 180, 248, 0.5);
      }

      /* ==========================================================================
         Base Styles & Reset
         ========================================================================== */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
        position: relative;
        transition: background 0.3s ease, color 0.3s ease;
      }

      /* Google 4-Color Top Brand Bar */
      .google-stripe {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        display: flex;
        z-index: 100;
      }
      .stripe-blue { flex: 1; background-color: var(--google-blue); }
      .stripe-red { flex: 1; background-color: var(--google-red); }
      .stripe-yellow { flex: 1; background-color: var(--google-yellow); }
      .stripe-green { flex: 1; background-color: var(--google-green); }

      /* Ambient Glowing Background Orbs */
      .ambient-glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
        z-index: 0;
        opacity: 0.85;
        transition: opacity 0.5s ease;
      }
      .glow-1 {
        top: -10%;
        left: -5%;
        width: 450px;
        height: 450px;
        background: radial-gradient(circle, var(--ambient-glow-1) 0%, transparent 70%);
      }
      .glow-2 {
        bottom: -10%;
        right: -5%;
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, var(--ambient-glow-2) 0%, transparent 70%);
      }
      .glow-3 {
        top: 20%;
        right: 15%;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, var(--ambient-glow-3) 0%, transparent 70%);
      }
      .glow-4 {
        bottom: 15%;
        left: 10%;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, var(--ambient-glow-4) 0%, transparent 70%);
      }

      /* Main Calculator Card Wrapper */
      .calculator-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 410px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        box-shadow: var(--card-shadow);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        padding: 24px 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }

      /* Header Bar */
      .calculator-header {
        position: relative;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 4px;
      }

      .gdg-branding {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: inherit;
        user-select: none;
      }

      /* Stylized GDG Brackets Logo */
      .gdg-logo-brackets {
        display: inline-flex;
        align-items: center;
        font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
        font-weight: 800;
        font-size: 20px;
        line-height: 1;
        letter-spacing: -2px;
      }
      .bracket-left-red { color: var(--google-red); }
      .bracket-left-yellow { color: var(--google-yellow); margin-right: 3px; }
      .bracket-right-green { color: var(--google-green); }
      .bracket-right-blue { color: var(--google-blue); }

      .gdg-text-block {
        display: flex;
        flex-direction: column;
      }
      .gdg-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .gdg-badge {
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: var(--google-blue-tint);
        color: var(--google-blue);
        padding: 2px 6px;
        border-radius: 10px;
      }
      .gdg-subtitle {
        font-size: 10.5px;
        color: var(--text-secondary);
        font-weight: 400;
      }

      /* Header Controls (History, Sound, Theme) */
      .header-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 12px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        cursor: pointer;
        position: relative;
        transition: background 0.2s, color 0.2s, transform 0.15s, border-color 0.2s;
      }
      .icon-btn:hover {
        background: var(--btn-fn-hover);
        color: var(--text-primary);
        transform: translateY(-1px);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .history-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        background: var(--google-blue);
        color: #FFFFFF;
        font-size: 9px;
        font-weight: 700;
        height: 14px;
        min-width: 14px;
        padding: 0 3px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(0);
        transition: transform 0.2s ease;
      }
      .history-badge.show {
        transform: scale(1);
      }

      /* ==========================================================================
         Dual-Line Screen Display
         ========================================================================== */
      .screen-display {
        background: var(--display-bg);
        border: 1px solid var(--display-border);
        border-radius: 20px;
        padding: 16px 18px 14px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        min-height: 120px;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
        transition: border-color 0.25s, box-shadow 0.25s;
      }

      .screen-top-meta {
        position: absolute;
        top: 10px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        user-select: none;
      }
      .bodmas-tag {
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(0, 0, 0, 0.04);
        padding: 2px 6px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        letter-spacing: 0.3px;
      }
      [data-theme="dark"] .bodmas-tag {
        background: rgba(255, 255, 255, 0.05);
      }
      .copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 10.5px;
        font-family: inherit;
        padding: 2px 4px;
        border-radius: 4px;
        transition: color 0.15s, background 0.15s;
      }
      .copy-btn:hover {
        color: var(--google-blue);
        background: var(--google-blue-tint);
      }

      /* Secondary Expression Line */
      .expression-display {
        width: 100%;
        min-height: 22px;
        color: var(--text-secondary);
        font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
        font-size: 14.5px;
        line-height: 1.4;
        text-align: right;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
        margin-top: 14px;
        margin-bottom: 2px;
        user-select: text;
        word-break: break-all;
      }
      .expression-display::-webkit-scrollbar {
        display: none;
      }

      /* Primary Active Number / Result Display */
      .primary-display {
        width: 100%;
        color: var(--text-primary);
        font-family: 'Google Sans', 'Roboto', sans-serif;
        font-size: 44px;
        font-weight: 500;
        line-height: 1.15;
        text-align: right;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
        letter-spacing: -0.5px;
        transition: font-size 0.15s ease, color 0.2s ease;
        user-select: text;
      }
      .primary-display::-webkit-scrollbar {
        display: none;
      }
      .primary-display.error-state {
        color: var(--google-red);
        font-size: 24px;
        font-weight: 500;
      }

      /* Quick Auxiliary Bar for Parentheses and Memory/Ans */
      .aux-toolbar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: -2px;
        margin-bottom: -4px;
      }
      .aux-btn {
        background: transparent;
        border: 1px solid var(--display-border);
        border-radius: 10px;
        height: 32px;
        font-size: 13px;
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }
      .aux-btn:hover {
        background: var(--btn-fn-hover);
        color: var(--text-primary);
        border-color: var(--text-muted);
      }
      .aux-btn:active, .aux-btn.key-pressed {
        transform: scale(0.95);
        background: var(--google-blue-tint);
        color: var(--google-blue);
      }

      /* ==========================================================================
         Interactive Keypad Grid
         ========================================================================== */
      .keypad-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        user-select: none;
      }

      .btn {
        position: relative;
        height: 60px;
        border-radius: 18px;
        font-family: 'Google Sans', 'Roboto', sans-serif;
        font-size: 20px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid transparent;
        transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1),
                    background-color 0.15s ease,
                    box-shadow 0.15s ease,
                    border-color 0.15s ease,
                    color 0.15s ease;
        outline: none;
      }

      .btn:focus-visible {
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      .btn:active, .btn.key-pressed {
        transform: scale(0.93) translateY(2px);
      }

      /* Number Buttons */
      .btn-num {
        background: var(--btn-num-bg);
        color: var(--btn-num-text);
        border-color: var(--btn-num-border);
        box-shadow: var(--btn-num-shadow);
      }
      .btn-num:hover {
        background: var(--btn-num-hover);
      }

      /* Operator Buttons */
      .btn-op {
        background: var(--btn-op-bg);
        color: var(--btn-op-text);
        border-color: var(--btn-op-border);
        font-size: 22px;
        font-weight: 600;
      }
      .btn-op:hover {
        background: var(--btn-op-hover);
      }
      .btn-op.active-op {
        box-shadow: 0 0 0 2px var(--google-blue);
        background: var(--google-blue-tint);
      }

      /* Function / Action Buttons (AC, DEL, %, ±) */
      .btn-fn {
        background: var(--btn-fn-bg);
        color: var(--btn-fn-text);
        border-color: var(--btn-fn-border);
        font-size: 17px;
        font-weight: 600;
      }
      .btn-fn:hover {
        background: var(--btn-fn-hover);
      }
      .btn-ac {
        color: var(--google-red);
      }
      .btn-del {
        color: var(--google-yellow);
      }

      /* Equals Button (Vibrant Google Gradient) */
      .btn-equals {
        background: var(--btn-equals-bg);
        color: var(--btn-equals-text);
        font-size: 24px;
        font-weight: 600;
        box-shadow: var(--btn-equals-shadow);
        border: none;
      }
      .btn-equals:hover {
        filter: brightness(1.08);
      }
      .btn-equals:active, .btn-equals.key-pressed {
        filter: brightness(0.95);
        box-shadow: 0 2px 8px rgba(66, 133, 244, 0.4);
      }

      /* Ripple Micro-Interaction */
      .ripple {
        position: absolute;
        border-radius: 50%;
        background: var(--ripple-color);
        transform: scale(0);
        animation: ripple-effect 0.45s linear;
        pointer-events: none;
      }
      @keyframes ripple-effect {
        to {
          transform: scale(3.5);
          opacity: 0;
        }
      }

      /* ==========================================================================
         Calculation History Drawer
         ========================================================================== */
      .history-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 28px;
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        backdrop-filter: blur(2px);
      }
      .history-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .history-drawer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 85%;
        background: var(--drawer-bg);
        border: 1px solid var(--drawer-border);
        border-radius: 24px 24px 28px 28px;
        z-index: 50;
        box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(24px);
        display: flex;
        flex-direction: column;
        transform: translateY(105%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      .history-drawer.open {
        transform: translateY(0);
      }

      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--drawer-border);
      }
      .history-title {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .history-clear-btn {
        background: none;
        border: none;
        color: var(--google-red);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: background 0.15s;
      }
      .history-clear-btn:hover {
        background: rgba(234, 67, 53, 0.1);
      }

      .history-list {
        padding: 12px 16px 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 380px;
        scrollbar-width: thin;
      }

      .history-item {
        background: var(--drawer-item-bg);
        border: 1px solid var(--drawer-border);
        border-radius: 14px;
        padding: 12px 14px;
        cursor: pointer;
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: background 0.15s, transform 0.15s, border-color 0.15s;
      }
      .history-item:hover {
        background: var(--drawer-item-hover);
        transform: translateX(-2px);
        border-color: var(--google-blue);
      }
      .history-item-expr {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .history-item-result {
        font-family: 'Google Sans', sans-serif;
        font-size: 20px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .history-item-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .history-empty {
        text-align: center;
        padding: 36px 16px;
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .history-empty svg {
        width: 40px;
        height: 40px;
        stroke: var(--text-muted);
        opacity: 0.6;
      }

      /* Toast Notification */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(50px);
        background: var(--text-primary);
        color: var(--card-bg);
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        z-index: 200;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      /* Keyboard Shortcuts Help Tip */
      .keyboard-hint {
        margin-top: 14px;
        text-align: center;
        font-size: 11.5px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .kbd-badge {
        display: inline-block;
        background: var(--card-border);
        color: var(--text-secondary);
        padding: 1px 5px;
        border-radius: 4px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
      }

      /* Responsive Adjustments */
      @media (max-width: 440px) {
        body {
          padding: 8px;
          justify-content: flex-start;
          padding-top: 12px;
        }
        .calculator-container {
          border-radius: 22px;
          padding: 18px 14px 16px;
          gap: 12px;
        }
        .screen-display {
          min-height: 105px;
          padding: 14px 14px 10px;
        }
        .primary-display {
          font-size: 38px;
        }
        .btn {
          height: 54px;
          border-radius: 14px;
          font-size: 18px;
        }
        .btn-op {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Google Color Stripe Top Accent -->
    <div class="google-stripe" aria-hidden="true">
      <div class="stripe-blue"></div>
      <div class="stripe-red"></div>
      <div class="stripe-yellow"></div>
      <div class="stripe-green"></div>
    </div>

    <!-- Background Ambient Lighting Mesh -->
    <div class="ambient-glow glow-1" aria-hidden="true"></div>
    <div class="ambient-glow glow-2" aria-hidden="true"></div>
    <div class="ambient-glow glow-3" aria-hidden="true"></div>
    <div class="ambient-glow glow-4" aria-hidden="true"></div>

    <!-- Main Glassmorphic Calculator Chassis -->
    <main class="calculator-container" role="application" aria-label="GDG Algiers Calculator">
      
      <!-- Top Branding & Navigation Bar -->
      <header class="calculator-header">
        <div class="gdg-branding">
          <div class="gdg-logo-brackets" aria-hidden="true">
            <span class="bracket-left-red">&lt;</span><span class="bracket-left-yellow">/</span><span class="bracket-right-green">&gt;</span>
          </div>
          <div class="gdg-text-block">
            <div class="gdg-title">
              GDG Algiers
              <span class="gdg-badge">Task</span>
            </div>
            <span class="gdg-subtitle">Google Developer Groups</span>
          </div>
        </div>

        <div class="header-controls">
          <!-- Audio Feedback Toggle Button -->
          <button id="sound-toggle-btn" class="icon-btn" aria-label="Toggle Sound Effects" title="Toggle Sound Feedback">
            <svg id="sound-icon" viewBox="0 0 24 24">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>

          <!-- History Drawer Toggle Button -->
          <button id="history-toggle-btn" class="icon-btn" aria-label="Open Calculation History" title="View History">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="history-counter" class="history-badge">0</span>
          </button>

          <!-- Light/Dark Mode Toggle Button -->
          <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle Theme" title="Switch Theme">
            <!-- Sun / Moon Icon dynamically populated -->
            <svg id="theme-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Dual-Line Screen Display -->
      <section class="screen-display" aria-live="polite">
        <div class="screen-top-meta">
          <span class="bodmas-tag" title="Strict PEMDAS/BODMAS Mathematical Operator Precedence">BODMAS PRECEDENCE</span>
          <button id="copy-btn" class="copy-btn" title="Copy result to clipboard">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy
          </button>
        </div>
        <!-- Active Expression History Line -->
        <div id="expression-display" class="expression-display" aria-label="Expression history"></div>
        <!-- Large Primary Display for Active Number / Result -->
        <div id="primary-display" class="primary-display" aria-label="Current value">0</div>
      </section>

      <!-- Auxiliary Bar: Parentheses, Previous Answer & Memory -->
      <div class="aux-toolbar">
        <button class="aux-btn" data-key="(" data-action="paren-open" aria-label="Open parenthesis">(</button>
        <button class="aux-btn" data-key=")" data-action="paren-close" aria-label="Close parenthesis">)</button>
        <button class="aux-btn" data-key="ans" data-action="ans" aria-label="Previous answer">Ans</button>
        <button class="aux-btn" data-key="^" data-action="op" data-value="^" aria-label="Power">x<sup style="font-size: 10px; font-weight: bold;">y</sup></button>
      </div>

      <!-- Interactive 5x4 Keypad Grid -->
      <section class="keypad-grid" role="group" aria-label="Calculator keypad">
        <!-- Row 1: AC, DEL, %, ÷ -->
        <button class="btn btn-fn btn-ac" data-key="Escape" data-action="clear" aria-label="All Clear">AC</button>
        <button class="btn btn-fn btn-del" data-key="Backspace" data-action="delete" aria-label="Delete last character">DEL</button>
        <button class="btn btn-fn" data-key="%" data-action="percent" aria-label="Percentage">%</button>
        <button class="btn btn-op" data-key="/" data-action="op" data-value="÷" aria-label="Divide">÷</button>

        <!-- Row 2: 7, 8, 9, × -->
        <button class="btn btn-num" data-key="7" data-action="num" data-value="7">7</button>
        <button class="btn btn-num" data-key="8" data-action="num" data-value="8">8</button>
        <button class="btn btn-num" data-key="9" data-action="num" data-value="9">9</button>
        <button class="btn btn-op" data-key="*" data-action="op" data-value="×" aria-label="Multiply">×</button>

        <!-- Row 3: 4, 5, 6, − -->
        <button class="btn btn-num" data-key="4" data-action="num" data-value="4">4</button>
        <button class="btn btn-num" data-key="5" data-action="num" data-value="5">5</button>
        <button class="btn btn-num" data-key="6" data-action="num" data-value="6">6</button>
        <button class="btn btn-op" data-key="-" data-action="op" data-value="−" aria-label="Subtract">−</button>

        <!-- Row 4: 1, 2, 3, + -->
        <button class="btn btn-num" data-key="1" data-action="num" data-value="1">1</button>
        <button class="btn btn-num" data-key="2" data-action="num" data-value="2">2</button>
        <button class="btn btn-num" data-key="3" data-action="num" data-value="3">3</button>
        <button class="btn btn-op" data-key="+" data-action="op" data-value="+" aria-label="Add">+</button>

        <!-- Row 5: ±, 0, ., = -->
        <button class="btn btn-fn" data-key="±" data-action="toggle-sign" aria-label="Toggle sign">±</button>
        <button class="btn btn-num" data-key="0" data-action="num" data-value="0">0</button>
        <button class="btn btn-num" data-key="." data-action="decimal" aria-label="Decimal point">.</button>
        <button class="btn btn-equals" data-key="Enter" data-action="equals" aria-label="Calculate equals">=</button>
      </section>

      <!-- History Drawer Overlay & Modal -->
      <div id="history-overlay" class="history-overlay" aria-hidden="true"></div>
      <div id="history-drawer" class="history-drawer" role="dialog" aria-modal="true" aria-label="Calculation History">
        <div class="history-header">
          <div class="history-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            History Log
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <button id="history-clear-btn" class="history-clear-btn" aria-label="Clear all calculation history">Clear All</button>
            <button id="history-close-btn" class="icon-btn" aria-label="Close history" style="width: 28px; height: 28px;">
              <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div id="history-list" class="history-list">
          <!-- Populated by JavaScript -->
        </div>
      </div>

    </main>

    <!-- Quick Keyboard Shortcuts Helper -->
    <footer class="keyboard-hint" aria-hidden="true">
      <span>Keyboard supported</span>
      <span>•</span>
      <span><span class="kbd-badge">Enter</span> =</span>
      <span><span class="kbd-badge">Esc</span> AC</span>
      <span><span class="kbd-badge">Backspace</span> DEL</span>
    </footer>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      <span id="toast-text">Copied to clipboard!</span>
    </div>

    <!-- ==========================================================================
         Pure Vanilla JavaScript: Mathematical Engine, State & Interactive Controls
         ========================================================================== -->
    <script src="script.js"></script>
  </body>
</html>
