<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GDG Algiers Calculator — Precision & Google Design</title>
    <meta name="description" content="Production-ready precision web calculator designed for GDG Algiers with BODMAS operator precedence, Google Developer aesthetic, dark/light theme, and calculation history." />
    <meta property="og:title" content="GDG Algiers Calculator" />
    <meta property="og:description" content="Production-ready precision web calculator designed for GDG Algiers with BODMAS operator precedence, Google Developer aesthetic, dark/light theme, and calculation history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#131314" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <style>
      /* ==========================================================================
         CSS Design Tokens & Theme Variables (Google Palette & GDG Algiers)
         ========================================================================== */
      :root {
        /* Google Core Brand Colors */
        --google-blue: #4285F4;
        --google-blue-hover: #3367D6;
        --google-blue-surface: #E8F0FE;
        --google-blue-tint: rgba(66, 133, 244, 0.12);
        --google-red: #EA4335;
        --google-yellow: #FBBC05;
        --google-green: #34A853;
        --google-green-hover: #2D9249;

        /* Light Theme Surface Tokens */
        --bg-gradient-start: #F8F9FA;
        --bg-gradient-end: #EDF2F7;
        --ambient-glow-1: rgba(66, 133, 244, 0.12);
        --ambient-glow-2: rgba(52, 168, 83, 0.10);
        --ambient-glow-3: rgba(251, 188, 5, 0.08);
        --ambient-glow-4: rgba(234, 67, 53, 0.08);

        --card-bg: rgba(255, 255, 255, 0.88);
        --card-border: rgba(220, 224, 230, 0.8);
        --card-shadow: 0 24px 48px -12px rgba(60, 64, 67, 0.18), 0 8px 16px -6px rgba(60, 64, 67, 0.08);
        
        --display-bg: rgba(241, 243, 244, 0.95);
        --display-border: rgba(218, 220, 224, 0.7);
        --text-primary: #202124;
        --text-secondary: #5F6368;
        --text-muted: #80868B;

        /* Buttons */
        --btn-num-bg: #FFFFFF;
        --btn-num-text: #202124;
        --btn-num-hover: #F8F9FA;
        --btn-num-border: #E8EAED;
        --btn-num-shadow: 0 2px 4px rgba(60, 64, 67, 0.08);

        --btn-op-bg: #E8F0FE;
        --btn-op-text: #1A73E8;
        --btn-op-hover: #D2E3FC;
        --btn-op-border: rgba(66, 133, 244, 0.25);

        --btn-fn-bg: #F1F3F4;
        --btn-fn-text: #3C4043;
        --btn-fn-hover: #E8EAED;
        --btn-fn-border: #DADCE0;

        --btn-equals-bg: linear-gradient(135deg, #4285F4 0%, #1A73E8 100%);
        --btn-equals-text: #FFFFFF;
        --btn-equals-shadow: 0 4px 14px rgba(66, 133, 244, 0.45);

        --drawer-bg: rgba(255, 255, 255, 0.97);
        --drawer-border: #E8EAED;
        --drawer-item-bg: #F8F9FA;
        --drawer-item-hover: #F1F3F4;

        --ripple-color: rgba(66, 133, 244, 0.25);
        --focus-ring: rgba(66, 133, 244, 0.4);
      }

      [data-theme="dark"] {
        /* Dark Theme Surface Tokens */
        --bg-gradient-start: #0E0F12;
        --bg-gradient-end: #1A1C23;
        --ambient-glow-1: rgba(66, 133, 244, 0.18);
        --ambient-glow-2: rgba(52, 168, 83, 0.14);
        --ambient-glow-3: rgba(251, 188, 5, 0.12);
        --ambient-glow-4: rgba(234, 67, 53, 0.14);

        --card-bg: rgba(30, 31, 34, 0.85);
        --card-border: rgba(255, 255, 255, 0.1);
        --card-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.65), 0 0 1px 1px rgba(255, 255, 255, 0.05);

        --display-bg: rgba(19, 19, 20, 0.92);
        --display-border: rgba(255, 255, 255, 0.08);
        --text-primary: #E3E3E3;
        --text-secondary: #9AA0A6;
        --text-muted: #5F6368;

        /* Buttons */
        --btn-num-bg: #2B2C30;
        --btn-num-text: #F1F3F4;
        --btn-num-hover: #37393E;
        --btn-num-border: rgba(255, 255, 255, 0.08);
        --btn-num-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);

        --btn-op-bg: #1B2B44;
        --btn-op-text: #8AB4F8;
        --btn-op-hover: #233B5F;
        --btn-op-border: rgba(138, 180, 248, 0.2);

        --btn-fn-bg: #35373C;
        --btn-fn-text: #E8EAED;
        --btn-fn-hover: #43454B;
        --btn-fn-border: rgba(255, 255, 255, 0.09);

        --btn-equals-bg: linear-gradient(135deg, #4285F4 0%, #1A73E8 100%);
        --btn-equals-text: #FFFFFF;
        --btn-equals-shadow: 0 4px 18px rgba(66, 133, 244, 0.55);

        --drawer-bg: rgba(25, 26, 29, 0.97);
        --drawer-border: rgba(255, 255, 255, 0.08);
        --drawer-item-bg: #202124;
        --drawer-item-hover: #2B2C30;

        --ripple-color: rgba(138, 180, 248, 0.3);
        --focus-ring: rgba(138, 180, 248, 0.5);
      }

      /* ==========================================================================
         Base Styles & Reset
         ========================================================================== */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(145deg, var(--bg-gradient-start), var(--bg-gradient-end));
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
        position: relative;
        transition: background 0.3s ease, color 0.3s ease;
      }

      /* Google 4-Color Top Brand Bar */
      .google-stripe {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        display: flex;
        z-index: 100;
      }
      .stripe-blue { flex: 1; background-color: var(--google-blue); }
      .stripe-red { flex: 1; background-color: var(--google-red); }
      .stripe-yellow { flex: 1; background-color: var(--google-yellow); }
      .stripe-green { flex: 1; background-color: var(--google-green); }

      /* Ambient Glowing Background Orbs */
      .ambient-glow {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
        z-index: 0;
        opacity: 0.85;
        transition: opacity 0.5s ease;
      }
      .glow-1 {
        top: -10%;
        left: -5%;
        width: 450px;
        height: 450px;
        background: radial-gradient(circle, var(--ambient-glow-1) 0%, transparent 70%);
      }
      .glow-2 {
        bottom: -10%;
        right: -5%;
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, var(--ambient-glow-2) 0%, transparent 70%);
      }
      .glow-3 {
        top: 20%;
        right: 15%;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, var(--ambient-glow-3) 0%, transparent 70%);
      }
      .glow-4 {
        bottom: 15%;
        left: 10%;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, var(--ambient-glow-4) 0%, transparent 70%);
      }

      /* Main Calculator Card Wrapper */
      .calculator-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 410px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        box-shadow: var(--card-shadow);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        padding: 24px 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }

      /* Header Bar */
      .calculator-header {
        position: relative;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 4px;
      }

      .gdg-branding {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: inherit;
        user-select: none;
      }

      /* Stylized GDG Brackets Logo */
      .gdg-logo-brackets {
        display: inline-flex;
        align-items: center;
        font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
        font-weight: 800;
        font-size: 20px;
        line-height: 1;
        letter-spacing: -2px;
      }
      .bracket-left-red { color: var(--google-red); }
      .bracket-left-yellow { color: var(--google-yellow); margin-right: 3px; }
      .bracket-right-green { color: var(--google-green); }
      .bracket-right-blue { color: var(--google-blue); }

      .gdg-text-block {
        display: flex;
        flex-direction: column;
      }
      .gdg-title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .gdg-badge {
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: var(--google-blue-tint);
        color: var(--google-blue);
        padding: 2px 6px;
        border-radius: 10px;
      }
      .gdg-subtitle {
        font-size: 10.5px;
        color: var(--text-secondary);
        font-weight: 400;
      }

      /* Header Controls (History, Sound, Theme) */
      .header-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .icon-btn {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 12px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        cursor: pointer;
        position: relative;
        transition: background 0.2s, color 0.2s, transform 0.15s, border-color 0.2s;
      }
      .icon-btn:hover {
        background: var(--btn-fn-hover);
        color: var(--text-primary);
        transform: translateY(-1px);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .history-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        background: var(--google-blue);
        color: #FFFFFF;
        font-size: 9px;
        font-weight: 700;
        height: 14px;
        min-width: 14px;
        padding: 0 3px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(0);
        transition: transform 0.2s ease;
      }
      .history-badge.show {
        transform: scale(1);
      }

      /* ==========================================================================
         Dual-Line Screen Display
         ========================================================================== */
      .screen-display {
        background: var(--display-bg);
        border: 1px solid var(--display-border);
        border-radius: 20px;
        padding: 16px 18px 14px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        min-height: 120px;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.04);
        transition: border-color 0.25s, box-shadow 0.25s;
      }

      .screen-top-meta {
        position: absolute;
        top: 10px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        user-select: none;
      }
      .bodmas-tag {
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(0, 0, 0, 0.04);
        padding: 2px 6px;
        border-radius: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px;
        letter-spacing: 0.3px;
      }
      [data-theme="dark"] .bodmas-tag {
        background: rgba(255, 255, 255, 0.05);
      }
      .copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 10.5px;
        font-family: inherit;
        padding: 2px 4px;
        border-radius: 4px;
        transition: color 0.15s, background 0.15s;
      }
      .copy-btn:hover {
        color: var(--google-blue);
        background: var(--google-blue-tint);
      }

      /* Secondary Expression Line */
      .expression-display {
        width: 100%;
        min-height: 22px;
        color: var(--text-secondary);
        font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
        font-size: 14.5px;
        line-height: 1.4;
        text-align: right;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
        margin-top: 14px;
        margin-bottom: 2px;
        user-select: text;
        word-break: break-all;
      }
      .expression-display::-webkit-scrollbar {
        display: none;
      }

      /* Primary Active Number / Result Display */
      .primary-display {
        width: 100%;
        color: var(--text-primary);
        font-family: 'Google Sans', 'Roboto', sans-serif;
        font-size: 44px;
        font-weight: 500;
        line-height: 1.15;
        text-align: right;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
        letter-spacing: -0.5px;
        transition: font-size 0.15s ease, color 0.2s ease;
        user-select: text;
      }
      .primary-display::-webkit-scrollbar {
        display: none;
      }
      .primary-display.error-state {
        color: var(--google-red);
        font-size: 24px;
        font-weight: 500;
      }

      /* Quick Auxiliary Bar for Parentheses and Memory/Ans */
      .aux-toolbar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: -2px;
        margin-bottom: -4px;
      }
      .aux-btn {
        background: transparent;
        border: 1px solid var(--display-border);
        border-radius: 10px;
        height: 32px;
        font-size: 13px;
        font-weight: 600;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }
      .aux-btn:hover {
        background: var(--btn-fn-hover);
        color: var(--text-primary);
        border-color: var(--text-muted);
      }
      .aux-btn:active, .aux-btn.key-pressed {
        transform: scale(0.95);
        background: var(--google-blue-tint);
        color: var(--google-blue);
      }

      /* ==========================================================================
         Interactive Keypad Grid
         ========================================================================== */
      .keypad-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        user-select: none;
      }

      .btn {
        position: relative;
        height: 60px;
        border-radius: 18px;
        font-family: 'Google Sans', 'Roboto', sans-serif;
        font-size: 20px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid transparent;
        transition: transform 0.1s cubic-bezier(0.2, 0, 0, 1),
                    background-color 0.15s ease,
                    box-shadow 0.15s ease,
                    border-color 0.15s ease,
                    color 0.15s ease;
        outline: none;
      }

      .btn:focus-visible {
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      .btn:active, .btn.key-pressed {
        transform: scale(0.93) translateY(2px);
      }

      /* Number Buttons */
      .btn-num {
        background: var(--btn-num-bg);
        color: var(--btn-num-text);
        border-color: var(--btn-num-border);
        box-shadow: var(--btn-num-shadow);
      }
      .btn-num:hover {
        background: var(--btn-num-hover);
      }

      /* Operator Buttons */
      .btn-op {
        background: var(--btn-op-bg);
        color: var(--btn-op-text);
        border-color: var(--btn-op-border);
        font-size: 22px;
        font-weight: 600;
      }
      .btn-op:hover {
        background: var(--btn-op-hover);
      }
      .btn-op.active-op {
        box-shadow: 0 0 0 2px var(--google-blue);
        background: var(--google-blue-tint);
      }

      /* Function / Action Buttons (AC, DEL, %, ±) */
      .btn-fn {
        background: var(--btn-fn-bg);
        color: var(--btn-fn-text);
        border-color: var(--btn-fn-border);
        font-size: 17px;
        font-weight: 600;
      }
      .btn-fn:hover {
        background: var(--btn-fn-hover);
      }
      .btn-ac {
        color: var(--google-red);
      }
      .btn-del {
        color: var(--google-yellow);
      }

      /* Equals Button (Vibrant Google Gradient) */
      .btn-equals {
        background: var(--btn-equals-bg);
        color: var(--btn-equals-text);
        font-size: 24px;
        font-weight: 600;
        box-shadow: var(--btn-equals-shadow);
        border: none;
      }
      .btn-equals:hover {
        filter: brightness(1.08);
      }
      .btn-equals:active, .btn-equals.key-pressed {
        filter: brightness(0.95);
        box-shadow: 0 2px 8px rgba(66, 133, 244, 0.4);
      }

      /* Ripple Micro-Interaction */
      .ripple {
        position: absolute;
        border-radius: 50%;
        background: var(--ripple-color);
        transform: scale(0);
        animation: ripple-effect 0.45s linear;
        pointer-events: none;
      }
      @keyframes ripple-effect {
        to {
          transform: scale(3.5);
          opacity: 0;
        }
      }

      /* ==========================================================================
         Calculation History Drawer
         ========================================================================== */
      .history-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 28px;
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        backdrop-filter: blur(2px);
      }
      .history-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .history-drawer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 85%;
        background: var(--drawer-bg);
        border: 1px solid var(--drawer-border);
        border-radius: 24px 24px 28px 28px;
        z-index: 50;
        box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(24px);
        display: flex;
        flex-direction: column;
        transform: translateY(105%);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      .history-drawer.open {
        transform: translateY(0);
      }

      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--drawer-border);
      }
      .history-title {
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .history-clear-btn {
        background: none;
        border: none;
        color: var(--google-red);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
        transition: background 0.15s;
      }
      .history-clear-btn:hover {
        background: rgba(234, 67, 53, 0.1);
      }

      .history-list {
        padding: 12px 16px 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 380px;
        scrollbar-width: thin;
      }

      .history-item {
        background: var(--drawer-item-bg);
        border: 1px solid var(--drawer-border);
        border-radius: 14px;
        padding: 12px 14px;
        cursor: pointer;
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: background 0.15s, transform 0.15s, border-color 0.15s;
      }
      .history-item:hover {
        background: var(--drawer-item-hover);
        transform: translateX(-2px);
        border-color: var(--google-blue);
      }
      .history-item-expr {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .history-item-result {
        font-family: 'Google Sans', sans-serif;
        font-size: 20px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .history-item-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .history-empty {
        text-align: center;
        padding: 36px 16px;
        color: var(--text-muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .history-empty svg {
        width: 40px;
        height: 40px;
        stroke: var(--text-muted);
        opacity: 0.6;
      }

      /* Toast Notification */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(50px);
        background: var(--text-primary);
        color: var(--card-bg);
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
        z-index: 200;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

    <!-- Toast Notification Popup -->

    <!-- ==========================================================================
         Pure Vanilla JavaScript: Mathematical Engine, State & Interactive Controls
         ========================================================================== -->
    <script>
      (function () {
        'use strict';

        /* ==========================================================================
           1. Pure Mathematical Engine (PEMDAS / BODMAS)
           ========================================================================== */
        const Precedence = {
          '+': 1,
          '-': 1,
          '*': 2,
          '/': 2,
          '%': 2,
          '^': 3
        };

        function normalizeExpression(raw) {
          return raw
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/−/g, '-')
            .replace(/,/g, '.')
            .replace(/\s+/g, '');
        }

        function tokenize(expr) {
          const norm = normalizeExpression(expr);
          const tokens = [];
          let i = 0;

          while (i < norm.length) {
            const ch = norm[i];

            if (ch === '(') {
              tokens.push({ type: 'lparen', value: '(' });
              i++;
              continue;
            }
            if (ch === ')') {
              tokens.push({ type: 'rparen', value: ')' });
              i++;
              continue;
            }

            if (ch === '+' || ch === '-' || ch === '*' || ch === '/' || ch === '%' || ch === '^') {
              const prev = tokens[tokens.length - 1];
              const isUnary = ch === '-' && (i === 0 || prev?.type === 'operator' || prev?.type === 'lparen');

              if (isUnary) {
                let numStr = '-';
                i++;
                while (i < norm.length && /[0-9.]/.test(norm[i])) {
                  numStr += norm[i];
                  i++;
                }
                if (numStr === '-') {
                  throw new Error('Invalid syntax: incomplete negative value');
                }
                if ((numStr.match(/\./g) || []).length > 1) {
                  throw new Error('Invalid number: multiple decimals');
                }
                tokens.push({ type: 'number', value: numStr });
                continue;
              }

              tokens.push({ type: 'operator', value: ch });
              i++;
              continue;
            }

            if (/[0-9.]/.test(ch)) {
              let numStr = '';
              while (i < norm.length && /[0-9.]/.test(norm[i])) {
                numStr += norm[i];
                i++;
              }
              if ((numStr.match(/\./g) || []).length > 1) {
                throw new Error('Invalid number: multiple decimals');
              }
              tokens.push({ type: 'number', value: numStr });
              continue;
            }

            throw new Error(`Unexpected character: ${ch}`);
          }

          return tokens;
        }

        function infixToPostfix(tokens) {
          const output = [];
          const opStack = [];

          for (const token of tokens) {
            if (token.type === 'number') {
              output.push(token);
            } else if (token.type === 'operator') {
              const pCurr = Precedence[token.value] || 0;
              while (opStack.length > 0 && opStack[opStack.length - 1].type === 'operator') {
                const top = opStack[opStack.length - 1];
                const pTop = Precedence[top.value] || 0;
                // Exponentiation is right-associative
                if (token.value === '^' ? pTop > pCurr : pTop >= pCurr) {
                  output.push(opStack.pop());
                } else {
                  break;
                }
              }
              opStack.push(token);
            } else if (token.type === 'lparen') {
              opStack.push(token);
            } else if (token.type === 'rparen') {
              let matched = false;
              while (opStack.length > 0) {
                const top = opStack.pop();
                if (top.type === 'lparen') {
                  matched = true;
                  break;
                }
                output.push(top);
              }
              if (!matched) throw new Error('Mismatched parentheses');
            }
          }

          while (opStack.length > 0) {
            const top = opStack.pop();
            if (top.type === 'lparen' || top.type === 'rparen') {
              throw new Error('Mismatched parentheses');
            }
            output.push(top);
          }

          return output;
        }

        function evaluatePostfix(postfix) {
          const stack = [];

          for (const token of postfix) {
            if (token.type === 'number') {
              stack.push(parseFloat(token.value));
            } else if (token.type === 'operator') {
              if (stack.length < 2) {
                throw new Error('Malformed expression syntax');
              }
              const b = stack.pop();
              const a = stack.pop();

              let val = 0;
              switch (token.value) {
                case '+': val = a + b; break;
                case '-': val = a - b; break;
                case '*': val = a * b; break;
                case '/':
                  if (b === 0) throw new Error('Cannot divide by zero');
                  val = a / b;
                  break;
                case '%':
                  if (b === 0) throw new Error('Cannot divide by zero');
                  val = a % b;
                  break;
                case '^': val = Math.pow(a, b); break;
                default: throw new Error(`Unknown operator: ${token.value}`);
              }
              stack.push(val);
            }
          }

          if (stack.length !== 1) {
            throw new Error('Malformed expression');
          }

          return stack[0];
        }

        function formatResult(val) {
          if (!Number.isFinite(val)) {
            if (Number.isNaN(val)) return 'Error';
            return val > 0 ? 'Infinity' : '-Infinity';
          }
          // Precision round to prevent 0.1 + 0.2 = 0.30000000000000004
          const rounded = parseFloat(val.toPrecision(12));
          if (Math.abs(rounded) >= 1e14 || (Math.abs(rounded) > 0 && Math.abs(rounded) < 1e-6)) {
            return rounded.toExponential(6).replace(/\.?0+e/, 'e');
          }
          return rounded.toString();
        }

        function evaluateExpression(raw) {
          try {
            const trimmed = raw.trim();
            if (!trimmed) return { success: true, result: '0' };
            const tokens = tokenize(trimmed);
            if (!tokens.length) return { success: true, result: '0' };
            const postfix = infixToPostfix(tokens);
            const num = evaluatePostfix(postfix);
            return { success: true, result: formatResult(num) };
          } catch (err) {
            return { success: false, result: 'Error', error: err.message || 'Error' };
          }
        }

        /* ==========================================================================
           2. Audio Synthesis (Web Audio API - Subtle Material Click Juice)
           ========================================================================== */
        let audioCtx = null;
        let isMuted = localStorage.getItem('gdg_calc_sound') === 'muted';

        function playKeyClickSound(type) {
          if (isMuted) return;
          try {
            if (!audioCtx) {
              const AudioContextClass = window.AudioContext || window.webkitAudioContext;
              if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
              audioCtx.resume();
            }
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            let freq = 480;
            if (type === 'equals') freq = 680;
            else if (type === 'clear') freq = 320;
            else if (type === 'op') freq = 540;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

            osc.start(now);
            osc.stop(now + 0.05);
          } catch (e) {
            // Audio context not allowed before interaction
          }
        }

        /* ==========================================================================
           3. UI State Management
           ========================================================================== */
        const state = {
          currentInput: '0',
          expressionFormula: '',
          lastEvaluated: false,
          lastAnswer: '0',
          history: []
        };

        // DOM Elements
        const primaryDisplay = document.getElementById('primary-display');
        const expressionDisplay = document.getElementById('expression-display');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const historyToggleBtn = document.getElementById('history-toggle-btn');
        const historyCounter = document.getElementById('history-counter');
        const historyDrawer = document.getElementById('history-drawer');
        const historyOverlay = document.getElementById('history-overlay');
        const historyList = document.getElementById('history-list');
        const historyClearBtn = document.getElementById('history-clear-btn');
        const copyBtn = document.getElementById('copy-btn');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toast-text');

        // Load History from localStorage
        try {
          const stored = localStorage.getItem('gdg_algiers_calc_history');
          if (stored) {
            state.history = JSON.parse(stored);
          }
        } catch (e) {
          state.history = [];
        }

        function saveHistory() {
          try {
            localStorage.setItem('gdg_algiers_calc_history', JSON.stringify(state.history.slice(0, 50)));
          } catch (e) {}
          updateHistoryUI();
        }

        function updateDisplay() {
          // Format primary display text
          primaryDisplay.textContent = state.currentInput;
          expressionDisplay.textContent = state.expressionFormula;

          // Adjust font size dynamically to fit content
          const len = state.currentInput.length;
          if (len > 14) {
            primaryDisplay.style.fontSize = '22px';
          } else if (len > 10) {
            primaryDisplay.style.fontSize = '28px';
          } else if (len > 8) {
            primaryDisplay.style.fontSize = '34px';
          } else {
            primaryDisplay.style.fontSize = '44px';
          }

          // Error styling
          if (state.currentInput === 'Error' || state.currentInput.startsWith('Cannot divide')) {
            primaryDisplay.classList.add('error-state');
          } else {
            primaryDisplay.classList.remove('error-state');
          }

          // Scroll both displays to right
          primaryDisplay.scrollLeft = primaryDisplay.scrollWidth;
          expressionDisplay.scrollLeft = expressionDisplay.scrollWidth;
        }

        /* ==========================================================================
           4. Calculator Operations
           ========================================================================== */
        function appendDigit(digit) {
          if (state.lastEvaluated) {
            state.currentInput = digit;
            state.expressionFormula = '';
            state.lastEvaluated = false;
          } else if (state.currentInput === '0' || state.currentInput === 'Error') {
            state.currentInput = digit;
          } else {
            state.currentInput += digit;
          }
          updateDisplay();
        }

        function appendDecimal() {
          if (state.lastEvaluated) {
            state.currentInput = '0.';
            state.expressionFormula = '';
            state.lastEvaluated = false;
            updateDisplay();
            return;
          }

          if (state.currentInput === 'Error') {
            state.currentInput = '0.';
            updateDisplay();
            return;
          }

          // Check if current input already contains a decimal point
          // If currentInput has multiple tokens (e.g. within compound formula), check the last segment
          const lastNumMatch = state.currentInput.match(/[0-9.]*$/);
          const currentSegment = lastNumMatch ? lastNumMatch[0] : state.currentInput;

          if (!currentSegment.includes('.')) {
            state.currentInput += '.';
            updateDisplay();
          }
        }

        function appendOperator(op) {
          if (state.currentInput === 'Error') {
            state.currentInput = '0';
          }

          // If right after an evaluation, continue from the previous answer
          if (state.lastEvaluated) {
            state.expressionFormula = state.currentInput + ' ' + op + ' ';
            state.currentInput = '0';
            state.lastEvaluated = false;
            updateDisplay();
            return;
          }

          // If currentInput is already set, append to expression formula
          const trimmedCurr = state.currentInput.trim();
          if (trimmedCurr !== '') {
            state.expressionFormula += trimmedCurr + ' ' + op + ' ';
            state.currentInput = '0';
          } else {
            // Replace the last operator in expressionFormula if user types another operator
            const trailingOpRegex = /\s*([+\-×÷\^])\s*$/;
            if (trailingOpRegex.test(state.expressionFormula)) {
              state.expressionFormula = state.expressionFormula.replace(trailingOpRegex, ' ' + op + ' ');
            }
          }
          updateDisplay();
        }

        function appendParenthesis(paren) {
          if (state.lastEvaluated) {
            state.expressionFormula = '';
            state.lastEvaluated = false;
          }

          if (paren === '(') {
            if (state.currentInput !== '0' && state.currentInput !== '') {
              state.expressionFormula += state.currentInput + ' × ( ';
            } else {
              state.expressionFormula += '( ';
            }
            state.currentInput = '0';
          } else if (paren === ')') {
            if (state.currentInput !== '') {
              state.expressionFormula += state.currentInput + ' ) ';
              state.currentInput = '';
            } else {
              state.expressionFormula += ') ';
            }
          }
          updateDisplay();
        }

        function toggleSign() {
          if (state.currentInput === 'Error' || state.currentInput === '0') return;

          if (state.currentInput.startsWith('-')) {
            state.currentInput = state.currentInput.slice(1);
          } else {
            state.currentInput = '-' + state.currentInput;
          }
          updateDisplay();
        }

        function applyPercentage() {
          if (state.currentInput === 'Error') return;

          const val = parseFloat(state.currentInput);
          if (Number.isFinite(val)) {
            const res = formatResult(val / 100);
            state.currentInput = res;
            updateDisplay();
          }
        }

        function deleteLast() {
          if (state.lastEvaluated) {
            state.expressionFormula = '';
            state.lastEvaluated = false;
            updateDisplay();
            return;
          }

          if (state.currentInput.length > 1) {
            state.currentInput = state.currentInput.slice(0, -1);
          } else {
            state.currentInput = '0';
          }
          updateDisplay();
        }

        function clearAll() {
          state.currentInput = '0';
          state.expressionFormula = '';
          state.lastEvaluated = false;
          updateDisplay();
        }

        function recallAns() {
          if (state.lastEvaluated) {
            state.expressionFormula = '';
            state.lastEvaluated = false;
          }
          state.currentInput = state.lastAnswer;
          updateDisplay();
        }

        function calculateEquals() {
          // Build complete formula
          let fullExpr = state.expressionFormula;
          if (state.currentInput !== '') {
            fullExpr += state.currentInput;
          } else if (!fullExpr.trim()) {
            fullExpr = '0';
          }

          fullExpr = fullExpr.trim();
          if (!fullExpr) return;

          // Close any open parentheses automatically for user convenience
          const openParens = (fullExpr.match(/\(/g) || []).length;
          const closeParens = (fullExpr.match(/\)/g) || []).length;
          if (openParens > closeParens) {
            fullExpr += ' )'.repeat(openParens - closeParens);
          }

          const evalResult = evaluateExpression(fullExpr);

          if (evalResult.success) {
            const rawExprClean = fullExpr;
            const resVal = evalResult.result;

            // Save record in history
            state.history.unshift({
              id: Date.now(),
              expression: rawExprClean,
              result: resVal,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            saveHistory();

            state.lastAnswer = resVal;
            state.expressionFormula = rawExprClean + ' =';
            state.currentInput = resVal;
            state.lastEvaluated = true;
          } else {
            state.expressionFormula = fullExpr + ' =';
            state.currentInput = evalResult.error || 'Error';
            state.lastEvaluated = true;
          }

          updateDisplay();
        }

        /* ==========================================================================
           5. History Drawer UI & Management
           ========================================================================== */
        function updateHistoryUI() {
          const count = state.history.length;
          historyCounter.textContent = count;
          if (count > 0) {
            historyCounter.classList.add('show');
          } else {
            historyCounter.classList.remove('show');
          }

          if (count === 0) {
            historyList.innerHTML = `
              <div class="history-empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>No calculations recorded yet.</span>
              </div>
            `;
            return;
          }

          historyList.innerHTML = state.history
            .map(
              (item) => `
              <div class="history-item" data-res="${item.result}" data-expr="${item.expression}" role="button" tabindex="0">
                <div class="history-item-expr">${item.expression} =</div>
                <div class="history-item-result">${item.result}</div>
                <div class="history-item-meta">
                  <span>${item.time}</span>
                  <span style="color: var(--google-blue); font-weight: 500;">Tap to use</span>
                </div>
              </div>
            `
            )
            .join('');
        }

        function toggleHistory(open) {
          const shouldOpen = open !== undefined ? open : !historyDrawer.classList.contains('open');
          if (shouldOpen) {
            historyDrawer.classList.add('open');
            historyOverlay.classList.add('open');
          } else {
            historyDrawer.classList.remove('open');
            historyOverlay.classList.remove('open');
          }
        }

        historyToggleBtn.addEventListener('click', () => toggleHistory());
        historyOverlay.addEventListener('click', () => toggleHistory(false));
        const historyCloseBtn = document.getElementById('history-close-btn');
        if (historyCloseBtn) {
          historyCloseBtn.addEventListener('click', () => toggleHistory(false));
        }
        historyClearBtn.addEventListener('click', () => {
          state.history = [];
          saveHistory();
          showToast('History cleared');
        });

        historyList.addEventListener('click', (e) => {
          const item = e.target.closest('.history-item');
          if (!item) return;
          const res = item.getAttribute('data-res');
          if (res) {
            state.currentInput = res;
            state.expressionFormula = '';
            state.lastEvaluated = false;
            updateDisplay();
            toggleHistory(false);
            showToast('Result loaded');
          }
        });

        /* ==========================================================================
           6. Toast Feedback Notification
           ========================================================================== */
        let toastTimeout = null;
        function showToast(msg) {
          toastText.textContent = msg;
          toast.classList.add('show');
          if (toastTimeout) clearTimeout(toastTimeout);
          toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
          }, 2000);
        }

        copyBtn.addEventListener('click', () => {
          const textToCopy = state.currentInput;
          if (!textToCopy || textToCopy === 'Error') return;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).then(() => {
              showToast('Copied: ' + textToCopy);
            }).catch(() => {
              fallbackCopy(textToCopy);
            });
          } else {
            fallbackCopy(textToCopy);
          }
        });

        function fallbackCopy(text) {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          try {
            document.execCommand('copy');
            showToast('Copied: ' + text);
          } catch (e) {
            showToast('Could not copy');
          }
          document.body.removeChild(textArea);
        }

        /* ==========================================================================
           7. Theme System & Sound Feedback Switcher
           ========================================================================== */
        const savedTheme = localStorage.getItem('gdg_calc_theme') ||
          (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

        function setTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('gdg_calc_theme', theme);

          const themeIcon = document.getElementById('theme-icon');
          if (theme === 'dark') {
            // Render Sun Icon (to switch to light)
            themeIcon.innerHTML = `
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            `;
          } else {
            // Render Moon Icon (to switch to dark)
            themeIcon.innerHTML = `
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            `;
          }
        }
        setTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'dark' ? 'light' : 'dark';
          setTheme(next);
          playKeyClickSound('op');
        });

        // Sound Toggle
        function updateSoundIcon() {
          const icon = document.getElementById('sound-icon');
          if (isMuted) {
            icon.innerHTML = `
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            `;
            soundToggleBtn.style.opacity = '0.55';
          } else {
            icon.innerHTML = `
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            `;
            soundToggleBtn.style.opacity = '1';
          }
        }
        updateSoundIcon();

        soundToggleBtn.addEventListener('click', () => {
          isMuted = !isMuted;
          localStorage.setItem('gdg_calc_sound', isMuted ? 'muted' : 'active');
          updateSoundIcon();
          if (!isMuted) playKeyClickSound('equals');
          showToast(isMuted ? 'Sound muted' : 'Sound enabled');
        });

        /* ==========================================================================
           8. Click & Ripple Micro-Animation Handlers
           ========================================================================== */
        function triggerRipple(btn, e) {
          const rect = btn.getBoundingClientRect();
          const circle = document.createElement('span');
          circle.classList.add('ripple');

          const diameter = Math.max(rect.width, rect.height);
          const radius = diameter / 2;

          let clientX = e?.clientX;
          let clientY = e?.clientY;

          if (!clientX || !clientY) {
            clientX = rect.left + rect.width / 2;
            clientY = rect.top + rect.height / 2;
          }

          circle.style.width = circle.style.height = `${diameter}px`;
          circle.style.left = `${clientX - rect.left - radius}px`;
          circle.style.top = `${clientY - rect.top - radius}px`;

          const existing = btn.getElementsByClassName('ripple')[0];
          if (existing) existing.remove();

          btn.appendChild(circle);
          setTimeout(() => circle.remove(), 450);
        }

        function handleButtonAction(btn, e) {
          triggerRipple(btn, e);

          const action = btn.getAttribute('data-action');
          const value = btn.getAttribute('data-value');

          switch (action) {
            case 'num':
              playKeyClickSound('num');
              appendDigit(value);
              break;
            case 'decimal':
              playKeyClickSound('num');
              appendDecimal();
              break;
            case 'op':
              playKeyClickSound('op');
              appendOperator(value);
              break;
            case 'equals':
              playKeyClickSound('equals');
              calculateEquals();
              break;
            case 'clear':
              playKeyClickSound('clear');
              clearAll();
              break;
            case 'delete':
              playKeyClickSound('clear');
              deleteLast();
              break;
            case 'toggle-sign':
              playKeyClickSound('op');
              toggleSign();
              break;
            case 'percent':
              playKeyClickSound('op');
              applyPercentage();
              break;
            case 'paren-open':
              playKeyClickSound('op');
              appendParenthesis('(');
              break;
            case 'paren-close':
              playKeyClickSound('op');
              appendParenthesis(')');
              break;
            case 'ans':
              playKeyClickSound('op');
              recallAns();
              break;
          }
        }

        // Attach Click to all Buttons
        document.querySelectorAll('.btn, .aux-btn').forEach((btn) => {
          btn.addEventListener('click', (e) => handleButtonAction(btn, e));
        });

        /* ==========================================================================
           9. Complete Keyboard Support & Visual Keypress Animations
           ========================================================================== */
        window.addEventListener('keydown', (e) => {
          // If modal history is open, allow Escape to close it
          if (e.key === 'Escape' && historyDrawer.classList.contains('open')) {
            toggleHistory(false);
            e.preventDefault();
            return;
          }

          let matchedBtn = null;

          if (/[0-9]/.test(e.key)) {
            matchedBtn = document.querySelector(`.btn[data-key="${e.key}"]`);
            if (matchedBtn) appendDigit(e.key);
          } else if (e.key === '.' || e.key === ',') {
            matchedBtn = document.querySelector('.btn[data-action="decimal"]');
            appendDecimal();
          } else if (e.key === '+') {
            matchedBtn = document.querySelector('.btn[data-key="+"]');
            appendOperator('+');
          } else if (e.key === '-') {
            matchedBtn = document.querySelector('.btn[data-key="-"]');
            appendOperator('−');
          } else if (e.key === '*') {
            matchedBtn = document.querySelector('.btn[data-key="*"]');
            appendOperator('×');
          } else if (e.key === '/') {
            matchedBtn = document.querySelector('.btn[data-key="/"]');
            appendOperator('÷');
          } else if (e.key === '^') {
            matchedBtn = document.querySelector('.aux-btn[data-key="^"]');
            appendOperator('^');
          } else if (e.key === '%') {
            matchedBtn = document.querySelector('.btn[data-key="%"]');
            applyPercentage();
          } else if (e.key === '(') {
            matchedBtn = document.querySelector('.aux-btn[data-key="("]');
            appendParenthesis('(');
          } else if (e.key === ')') {
            matchedBtn = document.querySelector('.aux-btn[data-key=")"]');
            appendParenthesis(')');
          } else if (e.key === 'Enter' || e.key === '=') {
            matchedBtn = document.querySelector('.btn-equals');
            calculateEquals();
            e.preventDefault();
          } else if (e.key === 'Backspace') {
            matchedBtn = document.querySelector('.btn-del');
            deleteLast();
          } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
            matchedBtn = document.querySelector('.btn-ac');
            clearAll();
          }

          if (matchedBtn) {
            matchedBtn.classList.add('key-pressed');
            triggerRipple(matchedBtn);
            playKeyClickSound(matchedBtn.getAttribute('data-action'));
            setTimeout(() => {
              matchedBtn.classList.remove('key-pressed');
            }, 160);
          }
        });

        // Initial setup
        updateHistoryUI();
        updateDisplay();
      })();
    </script>
  </body>
</html>
