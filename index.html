<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GDG Algiers Calculator — Precision & Google Design</title>
    <meta name="description" content="Production-ready precision web calculator designed for GDG Algiers with BODMAS operator precedence, Google Developer aesthetic, dark/light theme, and calculation history." />
    <meta property="og:title" content="GDG Algiers Calculator" />
    <meta property="og:description" content="Production-ready precision web calculator designed for GDG Algiers with BODMAS operator precedence, Google Developer aesthetic, dark/light theme, and calculation history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#131314" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    
  </head>
  <body>
    <!-- Google Color Stripe Top Accent -->
    <div class="google-stripe" aria-hidden="true">
      <div class="stripe-blue"></div>
      <div class="stripe-red"></div>
      <div class="stripe-yellow"></div>
      <div class="stripe-green"></div>
    </div>

    <!-- Background Ambient Lighting Mesh -->
    <div class="ambient-glow glow-1" aria-hidden="true"></div>
    <div class="ambient-glow glow-2" aria-hidden="true"></div>
    <div class="ambient-glow glow-3" aria-hidden="true"></div>
    <div class="ambient-glow glow-4" aria-hidden="true"></div>

    <!-- Main Glassmorphic Calculator Chassis -->
    <main class="calculator-container" role="application" aria-label="GDG Algiers Calculator">
      
      <!-- Top Branding & Navigation Bar -->
      <header class="calculator-header">
        <div class="gdg-branding">
          <div class="gdg-logo-brackets" aria-hidden="true">
            <span class="bracket-left-red">&lt;</span><span class="bracket-left-yellow">/</span><span class="bracket-right-green">&gt;</span>
          </div>
          <div class="gdg-text-block">
            <div class="gdg-title">
              GDG Algiers
              <span class="gdg-badge">Task</span>
            </div>
            <span class="gdg-subtitle">Google Developer Groups</span>
          </div>
        </div>

        <div class="header-controls">
          <!-- Audio Feedback Toggle Button -->
          <button id="sound-toggle-btn" class="icon-btn" aria-label="Toggle Sound Effects" title="Toggle Sound Feedback">
            <svg id="sound-icon" viewBox="0 0 24 24">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>

          <!-- History Drawer Toggle Button -->
          <button id="history-toggle-btn" class="icon-btn" aria-label="Open Calculation History" title="View History">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="history-counter" class="history-badge">0</span>
          </button>

          <!-- Light/Dark Mode Toggle Button -->
          <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle Theme" title="Switch Theme">
            <!-- Sun / Moon Icon dynamically populated -->
            <svg id="theme-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Dual-Line Screen Display -->
      <section class="screen-display" aria-live="polite">
        <div class="screen-top-meta">
          <span class="bodmas-tag" title="Strict PEMDAS/BODMAS Mathematical Operator Precedence">BODMAS PRECEDENCE</span>
          <button id="copy-btn" class="copy-btn" title="Copy result to clipboard">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy
          </button>
        </div>
        <!-- Active Expression History Line -->
        <div id="expression-display" class="expression-display" aria-label="Expression history"></div>
        <!-- Large Primary Display for Active Number / Result -->
        <div id="primary-display" class="primary-display" aria-label="Current value">0</div>
      </section>

      <!-- Auxiliary Bar: Parentheses, Previous Answer & Memory -->
      <div class="aux-toolbar">
        <button class="aux-btn" data-key="(" data-action="paren-open" aria-label="Open parenthesis">(</button>
        <button class="aux-btn" data-key=")" data-action="paren-close" aria-label="Close parenthesis">)</button>
        <button class="aux-btn" data-key="ans" data-action="ans" aria-label="Previous answer">Ans</button>
        <button class="aux-btn" data-key="^" data-action="op" data-value="^" aria-label="Power">x<sup style="font-size: 10px; font-weight: bold;">y</sup></button>
      </div>

      <!-- Interactive 5x4 Keypad Grid -->
      <section class="keypad-grid" role="group" aria-label="Calculator keypad">
        <!-- Row 1: AC, DEL, %, ÷ -->
        <button class="btn btn-fn btn-ac" data-key="Escape" data-action="clear" aria-label="All Clear">AC</button>
        <button class="btn btn-fn btn-del" data-key="Backspace" data-action="delete" aria-label="Delete last character">DEL</button>
        <button class="btn btn-fn" data-key="%" data-action="percent" aria-label="Percentage">%</button>
        <button class="btn btn-op" data-key="/" data-action="op" data-value="÷" aria-label="Divide">÷</button>

        <!-- Row 2: 7, 8, 9, × -->
        <button class="btn btn-num" data-key="7" data-action="num" data-value="7">7</button>
        <button class="btn btn-num" data-key="8" data-action="num" data-value="8">8</button>
        <button class="btn btn-num" data-key="9" data-action="num" data-value="9">9</button>
        <button class="btn btn-op" data-key="*" data-action="op" data-value="×" aria-label="Multiply">×</button>

        <!-- Row 3: 4, 5, 6, − -->
        <button class="btn btn-num" data-key="4" data-action="num" data-value="4">4</button>
        <button class="btn btn-num" data-key="5" data-action="num" data-value="5">5</button>
        <button class="btn btn-num" data-key="6" data-action="num" data-value="6">6</button>
        <button class="btn btn-op" data-key="-" data-action="op" data-value="−" aria-label="Subtract">−</button>

        <!-- Row 4: 1, 2, 3, + -->
        <button class="btn btn-num" data-key="1" data-action="num" data-value="1">1</button>
        <button class="btn btn-num" data-key="2" data-action="num" data-value="2">2</button>
        <button class="btn btn-num" data-key="3" data-action="num" data-value="3">3</button>
        <button class="btn btn-op" data-key="+" data-action="op" data-value="+" aria-label="Add">+</button>

        <!-- Row 5: ±, 0, ., = -->
        <button class="btn btn-fn" data-key="±" data-action="toggle-sign" aria-label="Toggle sign">±</button>
        <button class="btn btn-num" data-key="0" data-action="num" data-value="0">0</button>
        <button class="btn btn-num" data-key="." data-action="decimal" aria-label="Decimal point">.</button>
        <button class="btn btn-equals" data-key="Enter" data-action="equals" aria-label="Calculate equals">=</button>
      </section>

      <!-- History Drawer Overlay & Modal -->
      <div id="history-overlay" class="history-overlay" aria-hidden="true"></div>
      <div id="history-drawer" class="history-drawer" role="dialog" aria-modal="true" aria-label="Calculation History">
        <div class="history-header">
          <div class="history-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            History Log
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <button id="history-clear-btn" class="history-clear-btn" aria-label="Clear all calculation history">Clear All</button>
            <button id="history-close-btn" class="icon-btn" aria-label="Close history" style="width: 28px; height: 28px;">
              <svg viewBox="0 0 24 24" style="width: 16px; height: 16px;">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div id="history-list" class="history-list">
          <!-- Populated by JavaScript -->
        </div>
      </div>

    </main>

    <!-- Quick Keyboard Shortcuts Helper -->
    <footer class="keyboard-hint" aria-hidden="true">
      <span>Keyboard supported</span>
      <span>•</span>
      <span><span class="kbd-badge">Enter</span> =</span>
      <span><span class="kbd-badge">Esc</span> AC</span>
      <span><span class="kbd-badge">Backspace</span> DEL</span>
    </footer>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      <span id="toast-text">Copied to clipboard!</span>
    </div>

    <!-- ==========================================================================
         Pure Vanilla JavaScript: Mathematical Engine, State & Interactive Controls
         ========================================================================== -->
    <script src="script.js"></script>
  </body>
</html>
